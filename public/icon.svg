<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner ambient ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.25" stroke-dasharray="8 8" />

  <!-- Dumbbell Icon & 30 Badge -->
  <g transform="translate(106, 126)" filter="url(#shadow)">
    <!-- Dumbbell Bar -->
    <rect x="50" y="115" width="200" height="30" rx="15" fill="url(#glow)" />
    <!-- Center Grip Textured -->
    <rect x="110" y="105" width="80" height="50" rx="12" fill="#ffffff" />
    <line x1="130" y1="110" x2="130" y2="150" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <line x1="150" y1="110" x2="150" y2="150" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <line x1="170" y1="110" x2="170" y2="150" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Left Plate Large -->
    <rect x="30" y="60" width="32" height="140" rx="16" fill="url(#glow)" />
    <!-- Left Plate Small Outer -->
    <rect x="8" y="80" width="26" height="100" rx="13" fill="#34d399" opacity="0.9" />

    <!-- Right Plate Large -->
    <rect x="238" y="60" width="32" height="140" rx="16" fill="url(#glow)" />
    <!-- Right Plate Small Outer -->
    <rect x="266" y="80" width="26" height="100" rx="13" fill="#34d399" opacity="0.9" />
  </g>

  <!-- "30" Badge in Bottom Corner -->
  <g transform="translate(256, 320)">
    <rect x="40" y="30" width="130" height="64" rx="32" fill="#10b981" />
    <text x="105" y="74" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">30</text>
  </g>
</svg>
